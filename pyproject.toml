[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencelab-llm-eval-kit"
version = "0.1.0"
authors = [
    { name = "Mahrukh Baig", email = "mahrukhbaig11@gmail.com" }
]
description = "A lightweight, offline Python library for scoring LLM response quality. This project is made under the INFERENCE Lab engineering cohort 01."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["llm", "evaluation", "offline", "inference-lab", "cohort-01"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
llm-eval = "llm_eval_kit.cli:app"

[project.urls]
"Homepage" = "https://github.com/Inference-LAB/llm-eval-kit"
"Repository" = "https://github.com/Inference-LAB/llm-eval-kit.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_eval_kit*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring model downloads or pre-cached models)",
    "performance: marks tests as performance benchmarks (measuring latency or resource usage)",
]

